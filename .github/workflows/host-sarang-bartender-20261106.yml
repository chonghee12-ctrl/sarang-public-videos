name: Publish approved Sarang bartender media asset for IG Threads
on:
  push:
    paths:
      - '.github/workflows/host-sarang-bartender-20261106.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools for exporting owner's already-published YouTube Short
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download the published Sarang bartender short (not third-party video)
        run: |
          yt-dlp --no-playlist --retries 3 --extractor-retries 3 \
            -f 'bv*+ba/b' --merge-output-format mkv \
            -o '/tmp/sarang_bartender_source.%(ext)s' \
            'https://www.youtube.com/watch?v=7PhL9ZiPKGc'
          python - <<'PY'
          from glob import glob
          import subprocess,json
          files=glob('/tmp/sarang_bartender_source.*')
          if len(files)!=1:raise RuntimeError('Could not identify published Sarang source')
          import pathlib
          pathlib.Path('/tmp/sarang_source_path.txt').write_text(files[0])
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,width,height','-of','json',files[0]],text=True))
          if not any(s.get('codec_type')=='video' for s in meta['streams']):raise RuntimeError('No video stream')
          if not 29.5<float(meta['format']['duration'])<31.5:raise RuntimeError('Not the 30-second Sarang bartender')
          print('SARANG_BARTENDER_YOUTUBE_SOURCE_VERIFIED',meta['format']['duration'],files[0])
          PY
      - name: Prepare compatible H264/AAC 9:16 Instagram Reel and Threads MP4
        run: |
          mkdir -p videos
          ffmpeg -hide_banner -loglevel error -y \
            -i "$(cat /tmp/sarang_source_path.txt)" -map 0:v:0 -map 0:a:0 \
            -vf 'scale=720:1280:flags=lanczos,setsar=1' \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 -movflags +faststart \
            videos/sarang-cocktail-20261106.mp4
          python - <<'PY'
          import hashlib,subprocess,json
          from pathlib import Path
          f=Path('videos/sarang-cocktail-20261106.mp4')
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,width,height','-of','json',str(f)],text=True))
          if f.stat().st_size>60000000 or f.stat().st_size<300000:raise RuntimeError('Invalid video size')
          if abs(float(meta['format']['duration'])-30)>1:raise RuntimeError('Invalid length')
          if not any(s.get('codec_type')=='video' and s.get('width')==720 and s.get('height')==1280 for s in meta['streams']):raise RuntimeError('Not portrait')
          if not any(s.get('codec_type')=='audio' for s in meta['streams']):raise RuntimeError('Missing audio')
          with f.open('rb') as p:digest=hashlib.file_digest(p,'sha256').hexdigest()
          print('SARANG_PUBLIC_MP4_READY',digest,f.stat().st_size,meta['format']['duration'])
          PY
      - name: Commit original owner's approved public video asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/sarang-cocktail-20261106.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Host approved Sarang bartender Reel and Threads MP4'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
